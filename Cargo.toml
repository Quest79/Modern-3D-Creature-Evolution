[workspace]
members = [
    "crates/evolab-core",
    "crates/evolab-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rapier3d = { version = "0.35.3", features = ["serde-serialize"] }
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
